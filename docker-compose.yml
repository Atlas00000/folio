# Shared container log rotation (json-file) — keeps `docker logs` usable locally.
x-folio-logging: &folio-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:16-alpine
    container_name: folio-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio
    # Surface slow queries + connections for local debugging
    command:
      - postgres
      - -c
      - log_min_duration_statement=500
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_line_prefix=%t [%p] %u@%d 
    volumes:
      - folio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *folio-logging

  redis:
    image: redis:7-alpine
    container_name: folio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--loglevel", "notice"]
    volumes:
      - folio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *folio-logging

  # Object storage for materials (Week 3+). Image: quay.io mirror for broader pull access.
  minio:
    image: quay.io/minio/minio:latest
    container_name: folio-minio
    restart: unless-stopped
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: folio
      MINIO_ROOT_PASSWORD: folio-minio-secret
    volumes:
      - folio_minio_data:/data
    logging: *folio-logging

volumes:
  folio_postgres_data:
  folio_redis_data:
  folio_minio_data:
